[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryancad"
version = "0.1.0"
description = "Local parametric CAD with component organization and external-agent control"
requires-python = ">=3.12,<3.14"
dependencies = [
  "build123d==0.13.0",
  "svgelements==1.9.6",
  "pydantic==2.14.1",
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "planegcs==0.9.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
ryancad = "ryancad.__main__:main"
ryancad-mcp = "ryancad.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ryancad"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "ryancad/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
